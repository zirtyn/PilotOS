<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot-OS Protótipo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-image: linear-gradient(180deg, #1d1c1c, #080808);
        }
        .error {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 70%;
            height: 50%;
            margin: 5vh;
            background-color: #080808;
            border: solid 2px #352d2c;
            border-radius: 1em;
            padding: 2vh;
        }
        .error h1, h2 {
            text-align: center;
            font-family: 'Poppins-Regular';
            display: inline;
            color: #e0d4d2;
            height: auto;
        }
        .error h2 {
            font-size: 1.3em;
            color: #c9b9b7;
        }
        main {
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .close-blue {
            position: absolute;
            right: 10vh;
            top: 10vh;
            height: auto;
            width: auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="orientation">
        <div>
            <h1>Gire seu dispositivo para<br> melhor experiência.</h1>
            <img src="images/girar.png" alt="logo">
        </div>
    </div>
        <div class="navigation">
            <nav id="principalNav">
                <!-- clock -->
                <div id="clock"></div>
                    <script src="clock.js"></script>
                <!-- date -->
                <div id="date"></div>
                    <script src="date.js"></script>
                <!-- separator -->
                <div class="separator"></div>
                <!-- home -->
                <a href="index.html">
                    <img src="images/camera-home.png" alt="home">
                </a>
                <!-- volume -->
                <button id="btnAbrirVolume">
                    <img src="images/volume.png" alt="volumeButton">
                </button>
                <!-- Estrutura do Popup Volume -->
                <div id="popupVolume" class="popup-overlay">
                    <div class="popup-content">
                        <span class="close-btn">&times;</span>
                        <img src="images/volume.png" alt="volumeLogo">
                        <input type="range" id="sliderVolume" min="0" max="1" step="0.1" value="1">
                        <p>Volume: <span id="valorVolume">100%</span></p>
                    </div>
                </div>
                 <!-- bluetooth -->
                <button id="btnAbrirBluetooth">
                    <img src="images/bluetooth.png" alt="bluetoothButton">
                </button>
                 <!-- Estrutura do Popup bluetooth -->
                <div id="popupBluetooth" class="popup-overlay">
                    <div class="popup-content">
                        <span class="close-blue">&times;</span>
                        <img src="images/bluetooth.png" alt="bluetoothLogo">
                        <h2>Escaneando aparelhos
                            <span class="reticencias"></span>
                        </h2>
                    </div>
                </div>
                <script src="volume.js"></script>
                <script src="bluetooth.js"></script>
                <!-- back -->
                <a href="index.html">
                    <img src="images/back.png" alt="back">
                </a>
                <a href="camera.html">
                    <img src="images/camera-camera.png" alt="camera">
                </a>
            </nav>
        </div>
    <main>
        <div class="error">
            <h1>Não foi possível acessar a câmera</h1>
            <h2>Verifique se seu automóvel possui câmeras instaladas</h2>
        </div>
    </main>
</body>
</html>
