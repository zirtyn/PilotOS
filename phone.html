<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot-OS Protótipo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/phone-style.css">
</head>
<body>
    <div id="orientation">
        <div>
            <h1>Gire seu dispositivo para<br> melhor experiência.</h1>
            <img src="images/girar.png" alt="logo">
        </div>
    </div>
        <div class="navigation">
            <nav id="principalNav">
                <!-- clock -->
                <div id="clock"></div>
                    <script src="clock.js"></script>
                <!-- date -->
                <div id="date"></div>
                    <script src="date.js"></script>
                <!-- separator -->
                <div class="separator"></div>
                <!-- home -->
                <a href="index.html">
                    <img src="images/home.png" alt="home">
                </a>
                <!-- volume -->
                <button id="btnAbrirVolume">
                    <img src="images/volume.png" alt="volumeButton">
                </button>
                <!-- Estrutura do Popup Volume -->
                <div id="popupVolume" class="popup-overlay">
                    <div class="popup-content">
                        <span class="close-btn">&times;</span>
                        <img src="images/volume.png" alt="volumeLogo">
                        <input type="range" id="sliderVolume" min="0" max="1" step="0.1" value="1">
                        <p>Volume: <span id="valorVolume">100%</span></p>
                    </div>
                </div>
                 <!-- bluetooth -->
                <button id="btnAbrirBluetooth">
                    <img src="images/bluetooth.png" alt="bluetoothButton">
                </button>
                 <!-- Estrutura do Popup bluetooth -->
                <div id="popupBluetooth" class="popup-overlay">
                    <div class="popup-content">
                        <span class="close-blue">&times;</span>
                        <img src="images/bluetooth.png" alt="bluetoothLogo">
                        <h2>Escaneando aparelhos
                            <span class="reticencias"></span>
                        </h2>
                    </div>
                </div>
                <script src="volume.js"></script>
                <script src="bluetooth.js"></script>
                <!-- back -->
                <a href="index.html">
                    <img src="images/back.png" alt="back">
                </a>
                <a href="camera.html">
                    <img src="images/camera.png" alt="camera">
                </a>
            </nav>
        </div>
    <main>
        <div id="contatos">
            <h1>Contatos</h1>
            <div class="separator"></div>
            <h2>Por favor, conecte seu telefone
            para ver contatos e completar chamadas</h2>
        </div>
        <aside class="phone">
            <input type="text" id="display" readonly>
            <p id="status"></p>
            <div class="keypad">

                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>

                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>

                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>

                <button data-number="*">*</button>
                <button data-number="0">0</button>
                <button data-number="#">#</button>

            </div>
            <div class="actions">
                <button id="call">📞</button>
                <button id="delete">⌫</button>
            </div>

        </aside>
        <script src="phone.js"></script>
    </main>
</body>
</html>
